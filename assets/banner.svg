<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="EJWATT TV MOD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="50%" stop-color="#0b1f2b"/>
      <stop offset="100%" stop-color="#040c12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c4dff;#00ffa3;#00e5ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c4dff">
        <animate attributeName="stop-color" values="#7c4dff;#00ffa3;#00e5ff;#7c4dff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0affff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#glow)">
    <text x="600" y="150" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
          font-size="96" font-weight="bold" letter-spacing="10" fill="url(#neon)">
      EJWATT
      <animate attributeName="opacity" values="1;0.75;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="600" y="205" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="30" letter-spacing="16" fill="#dff7ff" opacity="0.92">TV MOD INSTALLER</text>

  <line x1="360" y1="232" x2="840" y2="232" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.8">
    <animate attributeName="x1" values="360;420;360" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="840;780;840" dur="6s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="270" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="16" letter-spacing="4" fill="#7fd4ff">LAUNCHER &middot; DEBLOAT &middot; AUTO CLEANER &middot; SCREENSAVER</text>

  <text x="600" y="308" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="15" letter-spacing="3" fill="#9fb8c4">by ejaywatt &nbsp;&middot;&nbsp; t.me/ejwtpkvpn</text>

  <circle cx="150" cy="90" r="3" fill="#00e5ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="120" r="3" fill="#7c4dff" opacity="0.9">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="60" r="2" fill="#00ffa3" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.7s" repeatCount="indefinite"/>
  </circle>
</svg>
